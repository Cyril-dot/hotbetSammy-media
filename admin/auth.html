<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HotBet — Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --night:        #060A12;
  --surface:      #150B0E;
  --surface-2:    #1E1015;
  --border:       rgba(255,255,255,0.07);
  --border-wine:  rgba(123,29,54,0.3);
  --wine:         #F36600;
  --wine-hi:      #FF7A1A;
  --wine-dk:      #C45200;
  --wine-glow:    rgba(123,29,54,0.35);
  --wine-dim:     rgba(123,29,54,0.15);
  --gold:         #FF7A1A;
  --gold-lt:      #FFB366;
  --gold-dk:      #C45200;
  --gold-dim:     rgba(200,146,42,0.15);
  --text:         #F8F9FA;
  --muted:        #8FA4CC;
  --error:        #E57373;
  --success:      #4ade80;
  --radius:       12px;
}

html, body {
  height: 100%;
  background: var(--night);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 65% 55% at 50% -5%, rgba(123,29,54,0.32) 0%, transparent 60%),
    radial-gradient(ellipse 45% 40% at 5%  95%, rgba(74,13,31,0.18)  0%, transparent 60%),
    radial-gradient(ellipse 40% 35% at 95% 95%, rgba(200,146,42,0.06) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

/* ── Corner ornaments ── */
.page::before, .page::after,
body::after {
  content: '';
  position: fixed;
  width: 32px; height: 32px;
  border-color: rgba(200,146,42,0.16);
  border-style: solid;
  pointer-events: none;
  z-index: 0;
}
.page::before { top: 22px; left: 22px;  border-width: 1.5px 0 0 1.5px; }
.page::after  { top: 22px; right: 22px; border-width: 1.5px 1.5px 0 0; }
body::after   { bottom: 22px; left: 22px; right: auto; border-width: 0 0 1.5px 1.5px; }

/* ── Brand ── */
.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 30px;
  animation: fadeDown 0.5s ease both;
}

.brand-icon {
  width: 48px;
  height: 48px;
  background: linear-gradient(145deg, var(--wine-hi), var(--wine-dk));
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 28px var(--wine-glow);
  flex-shrink: 0;
  border: 1px solid rgba(123,29,54,0.5);
}

.brand-name {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 0.04em;
}
.brand-hot { color: var(--text); }
.brand-bet   { color: var(--gold); }

/* ── Card ── */
.card {
  width: 100%;
  max-width: 432px;
  background: var(--surface);
  border: 1px solid var(--border-wine);
  border-radius: 20px;
  padding: 38px 34px;
  box-shadow:
    0 28px 70px rgba(0,0,0,0.65),
    0 0 0 1px rgba(200,146,42,0.04) inset;
  animation: fadeUp 0.5s ease 0.1s both;
}

.card-header { margin-bottom: 28px; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--gold-dim);
  border: 1px solid rgba(200,146,42,0.25);
  color: var(--gold-lt);
  font-size: 10.5px;
  font-weight: 700;
  padding: 4px 11px;
  border-radius: 20px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.card-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 22px;
  font-weight: 900;
  color: var(--text);
  margin-bottom: 5px;
  letter-spacing: 0.01em;
}

.card-sub {
  font-size: 13.5px;
  color: var(--muted);
}

/* ── Divider ── */
.gold-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 24px 0 0;
}
.gold-rule::before, .gold-rule::after {
  content: '';
  flex: 1;
  height: 1px;
}
.gold-rule::before { background: linear-gradient(to right,  transparent, rgba(200,146,42,0.25)); }
.gold-rule::after  { background: linear-gradient(to left,   transparent, rgba(200,146,42,0.25)); }
.gold-rule span { font-size: 0.6rem; color: var(--gold); letter-spacing: 0.1em; }

/* ── Form ── */
.form-group { margin-bottom: 20px; }

label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 8px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.input-wrap { position: relative; }

.input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  display: flex;
  align-items: center;
}
.input-icon svg {
  width: 15px; height: 15px;
  stroke: var(--muted);
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

input {
  width: 100%;
  height: 50px;
  background: var(--surface-2);
  border: 1.5px solid rgba(255,255,255,0.07);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14.5px;
  padding: 0 14px 0 44px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  -webkit-appearance: none;
}
input::placeholder { color: #3d2530; }
input:focus {
  border-color: rgba(155,37,66,0.6);
  box-shadow: 0 0 0 3px var(--wine-dim);
  background: #1a0d12;
}

.pass-input { padding-right: 48px; }

.toggle-pass {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 6px;
  display: flex;
  align-items: center;
  border-radius: 6px;
  transition: color 0.15s;
}
.toggle-pass:hover { color: var(--text); }
.toggle-pass svg {
  width: 15px; height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── Alerts ── */
.alert {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 15px;
  border-radius: 10px;
  font-size: 13.5px;
  margin-bottom: 22px;
  animation: fadeUp 0.25s ease;
  line-height: 1.5;
}
.alert svg {
  width: 15px; height: 15px;
  flex-shrink: 0;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.alert-error {
  background: rgba(229,115,115,0.09);
  border: 1px solid rgba(229,115,115,0.22);
  color: #FFB4B4;
}
.alert-error svg { stroke: var(--error); fill: none; }
.alert-success {
  background: rgba(74,222,128,0.08);
  border: 1px solid rgba(74,222,128,0.22);
  color: var(--success);
}
.alert-success svg { stroke: var(--success); fill: none; }

/* ── Submit ── */
.submit-btn {
  width: 100%;
  height: 52px;
  background: linear-gradient(135deg, var(--wine) 0%, var(--wine-hi) 100%);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-family: 'Inter', sans-serif;
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 26px;
  transition: background 0.2s, transform 0.12s, box-shadow 0.2s;
  box-shadow: 0 4px 24px var(--wine-glow);
  letter-spacing: 0.03em;
  position: relative;
  overflow: hidden;
}
.submit-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 55%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  transition: left 0.5s ease;
}
.submit-btn:hover:not(:disabled)::before { left: 145%; }
.submit-btn:hover:not(:disabled) {
  background: linear-gradient(135deg, var(--wine-hi) 0%, #B03050 100%);
  box-shadow: 0 6px 30px var(--wine-glow);
  transform: translateY(-1px);
}
.submit-btn:active:not(:disabled) { transform: translateY(0); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.submit-btn svg {
  width: 16px; height: 16px;
  stroke: #fff; fill: none;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── Spinner ── */
.spinner {
  width: 16px; height: 16px;
  border: 2.5px solid rgba(255,255,255,0.22);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}

/* ── Footer ── */
.footer {
  margin-top: 24px;
  font-size: 11.5px;
  color: var(--muted);
  text-align: center;
  animation: fadeUp 0.5s ease 0.2s both;
  opacity: 0.65;
  letter-spacing: 0.03em;
}

/* ── Animations ── */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .card { padding: 28px 22px; border-radius: 16px; }
  .brand-name { font-size: 22px; }
  .card-title { font-size: 20px; }
}
.brand-icon{background:var(--gold,#F36600) url("/hotbet-mark.svg") center/28px 28px no-repeat !important;} .brand-icon svg{display:none !important;}</style>
</head>
<body>
<div class="page">

  <!-- Brand -->
  <div class="brand">
    <div class="brand-icon">
      <!-- Heraldic crown SVG -->
      <svg width="26" height="24" viewBox="0 0 32 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lgCrown" x1="0" y1="0" x2="32" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#E8B84B"/>
            <stop offset="1" stop-color="#8C5C10"/>
          </linearGradient>
        </defs>
        <rect x="3" y="18" width="26" height="7" rx="2" fill="url(#lgCrown)"/>
        <path d="M3 18 L3 8 L9 14 L16 3 L23 14 L29 8 L29 18 Z" fill="url(#lgCrown)"/>
        <circle cx="3"  cy="8"  r="2.2" fill="#E8B84B"/>
        <circle cx="16" cy="3"  r="2.2" fill="#E8B84B"/>
        <circle cx="29" cy="8"  r="2.2" fill="#E8B84B"/>
      </svg>
    </div>
    <div class="brand-name">
      <span class="brand-hot">HOT</span><span class="brand-bet">BET</span>
    </div>
  </div>

  <!-- Card -->
  <div class="card">
    <div class="card-header">
      <div class="badge">
        <!-- Shield -->
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 6v6c0 5.5 3.5 10.7 8 12 4.5-1.3 8-6.5 8-12V6L12 2z"/></svg>
        Super Admin
      </div>
      <div class="card-title">Welcome back</div>
      <div class="card-sub">Sign in to manage your platform</div>
    </div>

    <div id="alert-box"></div>

    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
        </span>
        <input id="login-email" type="email" placeholder="admin@hotbet.app" autocomplete="email">
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input id="login-pass" type="password" class="pass-input"
               placeholder="Your password"
               autocomplete="current-password"
               onkeydown="if(event.key==='Enter')doLogin()">
        <button class="toggle-pass" id="eye-btn" onclick="togglePass()" type="button" aria-label="Toggle password visibility">
          <svg id="eye-icon" viewBox="0 0 24 24">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="gold-rule"><span>✦</span></div>

    <button class="submit-btn" id="login-btn" onclick="doLogin()" type="button">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Sign In to HotBet
    </button>
  </div>

  <div class="footer">HotBet &copy; 2024 &nbsp;·&nbsp; Super Admin Portal</div>

</div>

<script>
const BASE_URL = "https://futballbackend-production-f14d.up.railway.app";

function togglePass() {
  const inp  = document.getElementById('login-pass');
  const icon = document.getElementById('eye-icon');
  const isPass = inp.type === 'password';
  inp.type = isPass ? 'text' : 'password';
  icon.innerHTML = isPass
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
}

function showAlert(msg, type) {
  const icons = {
    error:   '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
    success: '<polyline points="20 6 9 17 4 12"/>'
  };
  document.getElementById('alert-box').innerHTML =
    `<div class="alert alert-${type}">
       <svg viewBox="0 0 24 24">${icons[type] || icons.error}</svg>
       <span>${msg}</span>
     </div>`;
}

function clearAlert() { document.getElementById('alert-box').innerHTML = ''; }

async function doLogin() {
  clearAlert();
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;

  if (!email || !password) {
    showAlert('Email and password are required.', 'error');
    return;
  }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Signing in…';

  try {
    const res  = await fetch(`${BASE_URL}/api/auth/login`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email, password })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.message || json.error || `HTTP ${res.status}`);

    const token = json.data?.token || json.token || json.data?.accessToken || json.accessToken;
    if (!token) throw new Error('No token returned. Check your API login endpoint.');

    const role = json.data?.role || json.data?.user?.role || json.role || '';
    if (role && !['ADMIN', 'SUPER_ADMIN'].includes(role)) {
      throw new Error(`Access denied. Role "${role}" is not permitted.`);
    }

    localStorage.setItem('fb_token', token);
    localStorage.setItem('accessToken', token);
    showAlert('Login successful! Redirecting…', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 800);

  } catch (e) {
    showAlert(e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In to HotBet`;
  }
}
</script>
</body>
</html>
